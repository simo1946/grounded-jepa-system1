[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-wm"
version = "0.1.0"
description = "Code for: Grounded JEPA World Models for Fast System-1 Control"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy", "scipy", "h5py", "stable-worldmodel==0.1.1", "ogbench==1.2.1", "nbformat"]

[project.optional-dependencies]
gpu = ["mamba-ssm"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "bench/lewm_suite"]
pythonpath = ["src", "bench/lewm_suite"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"
# First-party code for import sorting: the library (src/) and the experiment scripts (bench/lewm_suite/).
src = ["src", "bench/lewm_suite", "tests"]
# notebooks/ is generated by bench/lewm_suite/build_notebook.py and build_official_check_notebook.py;
# the GPU-study notebook is kept exactly as it was run.
extend-exclude = ["tests/third_party", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# E741: single-letter names (O, l) follow the paper's notation for model specs and lengths
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Markdown cells (tables, prose) are string literals that cannot be wrapped without changing the notebook.
"bench/lewm_suite/build_notebook.py" = ["E501"]
# ev() is defined and called within the same loop iteration, so it always sees that iteration's values.
"bench/lewm_suite/colab_plan.py" = ["B023"]
